<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল লাইব্রেরি বারকোড জেনারেটর</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 70px; 
        }
        .no-print { text-align: center; margin-bottom: 15px; }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            max-width: 1000px;
            margin: 0 auto;
        }
        .barcode-card { 
            background: white; 
            border: 1px solid #ccc; 
            padding: 4px; 
            text-align: center;
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .input-box { 
            width: 100%; 
            padding: 4px; 
            border: 1px solid #bbb; 
            border-radius: 3px; 
            font-size: 11px; 
            outline: none;
            margin-bottom: 4px;
        }
        .controls { 
            text-align: center; 
            padding: 10px; 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%;
            background: white; 
            border-top: 2px solid #28a745; 
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
        }
        button { 
            padding: 8px 18px; 
            cursor: pointer; 
            border-radius: 4px; 
            border: none; 
            font-weight: bold; 
            font-size: 13px;
            margin: 0 4px;
        }
        .add-btn { background: #28a745; color: white; }
        .print-btn { background: #007bff; color: white; }

        @media print {
            @page { size: A4; margin: 8mm; }
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .grid-container { 
                grid-template-columns: repeat(4, 1fr) !important; 
                gap: 2mm; 
            }
            .barcode-card { 
                border: 0.1px solid #aaa; 
                padding: 1.5mm; 
                page-break-inside: avoid;
                height: auto !important; 
                min-height: 0 !important;
            }
            svg { 
                width: 100% !important; 
                height: auto !important; 
                display: block;
            }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h3 style="margin:0 0 5px 0;">জেলা সরকারি গণগ্রন্থাগার, লালমনিরহাট </h3>
</div>

<div id="barcode-grid" class="grid-container"></div>

<div class="no-print controls">
    <button class="add-btn" onclick="addNewField()">+ নতুন বই</button>
    <button class="print-btn" onclick="window.print()">প্রিন্ট (A4)</button>
</div>

<script>
    let count = 0;

    function addNewField() {
        count++;
        const grid = document.getElementById('barcode-grid');
        const div = document.createElement('div');
        div.className = 'barcode-card';
        div.id = `card-${count}`;
        div.innerHTML = `
            <input type="text" class="input-box no-print" id="barcode-input-${count}" placeholder="Barcode" oninput="drawBarcode(${count})" onkeydown="checkNextField(event, ${count})">
            <svg id="barcode-svg-${count}"></svg>
        `;
        grid.appendChild(div);
        document.getElementById(`barcode-input-${count}`).focus();
    }

    function drawBarcode(id) {
        const value = document.getElementById(`barcode-input-${id}`).value;
        const svg = document.getElementById(`barcode-svg-${id}`);
        if (value.trim() !== "") {
            JsBarcode(`#barcode-svg-${id}`, value, {
                format: "CODE128",
                width: 1.2,
                height: 10,     // বারকোডের দাগের উচ্চতা ১০
                displayValue: true,
                fontSize: 11,   // ফন্ট সাইজ ১১
                margin: 0
            });
        } else {
            svg.innerHTML = "";
        }
    }

    function checkNextField(event, id) { 
        if (event.key === "Enter") {
            event.preventDefault();
            addNewField(); 
        }
    }

    window.onload = addNewField;
</script>
</body>
</html>
