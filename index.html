<!-- Inventor Modal 


</script>
    let count = 0;

    function addNewField() {
        count++;
        const grid = document.getElementById('barcode-grid');
        const div = document.createElement('div');
        div.className = 'barcode-card';
        div.id = `card-${count}`;
        div.innerHTML = `
            <input type="text" class="input-box no-print" id="barcode-input-${count}" placeholder="Barcode" oninput="drawBarcode(${count})" onkeydown="checkNextField(event, ${count})">
            <svg id="barcode-svg-${count}"></svg>
        `;
        grid.appendChild(div);
        document.getElementById(`barcode-input-${count}`).focus();
    }

    function drawBarcode(id) {
        const value = document.getElementById(`barcode-input-${id}`).value;
        const svg = document.getElementById(`barcode-svg-${id}`);
        if (value.trim() !== "") {
            JsBarcode(`#barcode-svg-${id}`, value, {
                format: "CODE128",
                width: 1.2,
                height: 10,   
                displayValue: true,
                fontSize: 11,   
                margin: 0
            });
        } else {
            svg.innerHTML = "";
        }
    }

    function checkNextField(event, id) { 
        if (event.key === "Enter") {
            event.preventDefault();
            addNewField(); 
        }
    }

    // Modal functions
    function openInventorModal() {
        document.getElementById('inventorModal').style.display = 'flex';
    }

    function closeInventorModal() {
        document.getElementById('inventorModal').style.display = 'none';
    }

    window.onload = addNewField;
</script>
</body>
